baseURL: "https://zeztzchen.github.io/"
locale: "zh-CN"
defaultContentLanguage: "zh"
disableLanguages:
  - en
title: "Kun's Thoughts"
theme: "PaperMod"
enableRobotsTXT: true
enableInlineShortcodes: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true
mainsections: ["posts"]
hasCJKLanguage: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

languages:
  en:
    label: "En"
    locale: "en"
    weight: 2
    title: "Kun's Thoughts"
    params:
      description: "Kun's personal blog sharing thoughts on technology, programming, and life."
      author: "Zikun"
      homeInfoParams:
        Title: "Welcome to Kun's Thoughts 👋"
        Content: >
          This is my personal blog where I share thoughts on technology,
          programming, and life experiences. Feel free to explore and connect with me!
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Categories
          url: categories/
          weight: 8
        - name: Tags
          url: tags/
          weight: 9
        - name: Search
          url: search/
          weight: 10

  zh:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    title: "Kun's Thoughts"
    params:
      description: "个人博客，分享技术、编程和生活的点滴思考。"
      author: "梓坤"
      homeInfoParams:
        Title: "石头滚下山坡瞬间，我获得短暂的自由。"
        Content: >
          - 我会在这里分享我最近学习的内容

          - 希望对你有所帮助！
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 归档
          url: archives
          weight: 5
        - name: 分类
          url: categories/
          weight: 8
        - name: 标签
          url: tags/
          weight: 9
        - name: 搜索
          url: search/
          weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "个人博客，分享技术、编程和生活的点滴思考。"
  author: "梓坤"
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: false
  comments: false
  images: ["images/cover.png"]

  profileMode:
    enabled: false
    title: "石头滚下山坡瞬间，我获得短暂的自由。"
    subtitle: "我会在这里分享我最近学习的内容，希望对你有所帮助！"
    buttons:
      - name: 笔记
        url: /posts/
      - name: 归档
        url: /archives/
      - name: 分类
        url: /categories/
      - name: 标签
        url: /tags/

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/zeztzchen"
    - name: rss
      title: RSS

  assets:
    disableHLJS: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
            - - \[
              - \]
          inline:
            - - $
              - $
            - - \(
              - \)
    renderer:
      unsafe: true
  highlight:
    noClasses: false
